[package]
name = "engine"
version = "0.1.0"
edition = "2024"

[dependencies]
geo = { version = "0.33.1", default-features = false }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Crate autonome : son propre espace de travail.
[workspace]

[profile.release]
codegen-units = 1
lto = "thin"
